<!DOCTYPE html>
<html>
<head>
  <title>For Kritika 💖</title>
  <style>
    body {
      margin:0;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background: linear-gradient(135deg,#ff9a9e,#fad0c4);
      font-family:cursive;
      overflow: hidden;
    }

    .container {
      text-align:center;
      background: rgba(255,255,255,0.9);
      padding:30px;
      border-radius:20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      width: 300px;
      height: 300px;
    }

    #noBtn {
      font-size:22px;
      padding:10px 25px;
      border:none;
      border-radius:30px;
      background:#adb5bd;
      color:white;
      cursor:pointer;
      position:absolute;
      left: 50%;
      top: 200px;
      transform: translate(-50%, -50%);
    }

    #yesBtn {
      font-size:22px;
      padding:10px 25px;
      margin:10px;
      border:none;
      border-radius:30px;
      background:#ff4d6d;
      color:white;
      cursor:pointer;
    }

    #fromName {
      font-size:16px;
      margin-top:15px;
      color:#ff4d6d;
    }

    /* Confetti Styles */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background-color: red;
      top: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Hey Kritika 💕🌸</h1>
  <p style="font-size:32px;">Will you be my Valentine? 💘🥰</p>
  <p style="font-size:20px;">You already make my heart smile 💖✨</p>

  <button id="yesBtn">Yes 💝😍</button>
  <button id="noBtn">No 🙈💔</button>

  <div id="fromName">— From Lovesh 💌</div>
</div>

<script>
  // NO button bhaagta hai
  const noBtn = document.getElementById("noBtn");
  const container = document.querySelector(".container");

  function moveButton() {
    const maxX = container.offsetWidth - noBtn.offsetWidth;
    const maxY = container.offsetHeight - noBtn.offsetHeight;
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  noBtn.addEventListener("mouseenter", moveButton);
  noBtn.addEventListener("touchstart", moveButton);

  // YES button alert + confetti
  const yesBtn = document.getElementById("yesBtn");
  yesBtn.addEventListener("click", () => {
    alert("YAYYY!! 🥰💖✨\nYou just made my heart the happiest 💕🌹");
    createConfetti(100);
  });

  // Confetti generator
  function createConfetti(num) {
    for (let i = 0; i < num; i++) {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");
      confetti.style.backgroundColor = randomColor();
      confetti.style.left = Math.random() * window.innerWidth + "px";
      confetti.style.animation = `fall ${Math.random()*3 + 2}s linear forwards`;
      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 4000);
    }
  }

  function randomColor() {
    const colors = ["#ff0a54","#ff477e","#ff7096","#ff85a1","#fbb1b1","#f9bec7"];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Confetti animation
  const style = document.createElement('style');
  style.innerHTML = `
  @keyframes fall {
    0% {transform: translateY(0px) rotate(0deg);}
    100% {transform: translateY(100vh) rotate(360deg);}
  }`;
  document.head.appendChild(style);
</script>

</body>
</html>
